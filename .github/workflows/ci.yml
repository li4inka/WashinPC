name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build, test, package
        shell: powershell
        run: ./scripts/package.ps1 -Architecture ${{ matrix.architecture }}
      - name: Upload preview packages
        uses: actions/upload-artifact@v4
        with:
          name: WashinPC-win-${{ matrix.architecture }}
          path: artifacts/portable/*
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.architecture }}
          path: artifacts/test-results/**/*.trx
